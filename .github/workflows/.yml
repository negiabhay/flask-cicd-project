# Payeasy CI/CD Pipeline
name: Flask app Pipeline


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Step 1 - Download the code 
        uses: actions/checkout@v4

      - name: Step 2 - Download Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Step 3 - Install Dependencies
        run: pip install -r requirements.txt

      - name: Step 4 - Run the Test
        run: pytest
        
  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      APP_NAME: PayEasy
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Download Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Bundle the code
        run: zip -r payeasy.zip app.py requirements.txt

      - name: Print Deploy info
        env:
          APP_VERSION: ${{ secrets.APP_VERSION }}
        run: |
          echo "APP_NAME is $APP_NAME"
          echo "APP_VERSION is $APP_VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payeasy-package
          path: payeasy.zip
          retention-days: 5
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the code
        uses: actions/download-artifact@v4
        with:
          name: payeasy-package
          
      - name: Copy code to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: payeasy.zip
          target: /home/ubuntu
          
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update
            sudo apt install unzip python3-pip -y
            cd /home/ubuntu
            unzip -o payeasy.zip
            sudo pip3 install -r requirements.txt
            echo "Deployment done on EC2"
  
