name: Flask app Pipeline


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'

jobs::
  test:
    runs-on: ubuntu-latest
  strategy:
  fail-fast: false
  matrix:
    python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Step 1 - Download the code 
        uses: actions/checkout@v4

      - name: Step 2 - Download Python
        uses: actions/checkout@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Step 3 - Install Dependencies
        run: pip install -r requirements.txt

      - name: Step 4 - Run the Test
        run: pytest
        
  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      APP_NAME: PayEasy
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Download Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Bundle the code
        run: zip -r payeasy.zip app.py requirements.txt

      - name: Print Deploy info
        env:
          APP_VERSION: ${{ secret.APP_VERSION }}
        run: |
          echo: "APP_NAME is $APP_NAME"
          echo: "APP_VERSION is $APP_VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact
        with:
          name: payeasy-package
          path: payeasy.zip
          retention-days: 5
